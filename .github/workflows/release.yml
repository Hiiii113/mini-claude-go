name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          rm -rf build dist
          mkdir -p build dist

          package() {
            local os="$1"
            local arch="$2"
            local name="mini-claude-go_${version}_${os}_${arch}"
            local binary="mini-claude"
            if [[ "$os" == "windows" ]]; then
              binary="mini-claude.exe"
            fi

            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "build/${name}/${binary}" .
            cp README.md LICENSE "build/${name}/"

            if [[ "$os" == "windows" ]]; then
              (cd build && zip -qr "../dist/${name}.zip" "$name")
            else
              (cd build && tar -czf "../dist/${name}.tar.gz" "$name")
            fi
          }

          for os in windows linux darwin; do
            for arch in amd64 arm64; do
              package "$os" "$arch"
            done
          done

          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "Mini Claude Go ${GITHUB_REF_NAME}"
